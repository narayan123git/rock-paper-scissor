<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container glass">
    <h1>🪨 📄 ✂️ Rock Paper Scissors</h1>
    <p class="round-info">Best of 5</p>
    
    <div class="choices">
      <button data-choice="rock">🪨</button>
      <button data-choice="paper">📄</button>
      <button data-choice="scissors">✂️</button>
    </div>

    <div class="result">
      <p class="status">Make your move!</p>
      <p class="score">You 0 - 0 AI</p>
    </div>

    <button class="restart">🔁 Restart Game</button>
  </div>

  <footer>
    <p>Built with ❤️ by Sonai</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
